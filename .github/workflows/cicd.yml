name: Fit-again CI/CD

# main 브랜치에 push가 발생했을 때
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 깃허브 코드 가져오기
    - name: 저장소 코드 불러오기 (Checkout)
      uses: actions/checkout@v3

    # 2. 자바 17 세팅
    - name: JDK 17 설정
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'

    # 3. 빌드 권한 부여 및 빌드 (테스트 코드는 제외)
    - name: gradlew 실행 권한 부여
      run: chmod +x ./gradlew

    - name: Gradle로 빌드하기
      run: ./gradlew build -x test

    # 4. 배포 스크립트를 EC2로 전송
    - name: 배포용 deploy.sh 스크립트 복사
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "scripts/deploy.sh"
        target: "/home/ubuntu/app"

    # 5. 빌드된 JAR 파일을 EC2로 전송
    - name: 빌드된 JAR 파일 복사
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*SNAPSHOT.jar"
        target: "/home/ubuntu/app/build"
        strip_components: 2

    # 6. EC2에 접속해서 배포 스크립트 실행명령 내리기
    - name: EC2 접속 및 배포 스크립트 실행
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          chmod +x /home/ubuntu/app/scripts/deploy.sh
          /home/ubuntu/app/scripts/deploy.sh
