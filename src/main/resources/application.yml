spring:
  application:
    name: fitagain

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o

  cloud:
    aws:
      s3:
        bucket: ${AWS_BUCKET}
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2

  profiles:
    active: local # 기본으로 local 프로필 실행

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100